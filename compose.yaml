services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_learning}
      POSTGRES_USER: ${POSTGRES_USER:-todo_learning_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - todo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-todo_learning_user}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-todo_learning}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.docker}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  todo-postgres-data: